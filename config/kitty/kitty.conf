# kitty.conf — wezterm (~/.config/wezterm) からの移植
# 既定テンプレート (全項目のドキュメント) は kitty.conf.default に退避してある

#: remote control (terminal-browser 用、移植前から) {{{
allow_remote_control socket-only
listen_on unix:/tmp/kitty
#: }}}

#: フォント {{{
font_family      family="Moralerspace Neon" style=Bold
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0
# ホスト別の上書き (ayame.local は font_size 14)。無ければ無視される
include local.conf
#: }}}

#: ウィンドウ {{{
remember_window_size  no
initial_window_width  180c
initial_window_height 50c
hide_window_decorations titlebar-only
background_opacity 0.85
enable_audio_bell yes
scrollback_lines 250000
cursor_shape block
cursor_blink_interval 0
enabled_layouts splits,stack
macos_option_as_alt yes
window_border_width   1px
active_border_color   #81a1c1
inactive_border_color #4c566a
#: }}}

#: 配色 (Nord。背景は wezterm の window_background_gradient に合わせて黒) {{{
foreground #d8dee9
background #000000
cursor            #d8dee9
cursor_text_color #2e3440
selection_foreground #d8dee9
selection_background #4c566a
color0  #3b4252
color1  #bf616a
color2  #a3be8c
color3  #ebcb8b
color4  #81a1c1
color5  #b48ead
color6  #88c0d0
color7  #e5e9f0
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4
#: }}}

#: タブバー {{{
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_style separator
tab_separator ""
tab_title_max_length 25
tab_title_template " {index}:{title[:21]:<21} "
active_tab_foreground   #000000
active_tab_background   #87CEFA
active_tab_font_style   normal
inactive_tab_foreground #d8dee9
inactive_tab_background #282828
inactive_tab_font_style normal
#: }}}

#: キーバインド {{{
# 既定を全部消し、wezterm と同じ leader = Ctrl+T (2秒でキャンセル) の2段階キーにする
clear_all_shortcuts yes
map_timeout 2.0

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+h hide_macos_app
map cmd+m minimize_macos_window
map cmd+q quit
map cmd+shift+p command_palette

# map cmd+f              show_scrollback
# map ctrl+t>ctrl+space  show_scrollback

map cmd+k     clear_terminal scrollback active
map cmd+alt+k combine : clear_terminal scrollback active : clear_terminal clear active

# send Ctrl+T
map ctrl+t>ctrl+t send_text all \x14
# Claude Code: new line Shift+Enter
map shift+enter send_text all \x1b\r

map page_up   scroll_page_up
map page_down scroll_page_down

map cmd+0     change_font_size all 0
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0

map ctrl+t>1 goto_tab 1
map ctrl+t>2 goto_tab 2
map ctrl+t>3 goto_tab 3
map ctrl+t>4 goto_tab 4
map ctrl+t>5 goto_tab 5
map ctrl+t>6 goto_tab 6
map ctrl+t>7 goto_tab 7
map ctrl+t>8 goto_tab 8
map ctrl+t>9 goto_tab 9

map ctrl+t>c      new_tab
map ctrl+t>x      close_tab
map ctrl+t>ctrl+l next_tab
map ctrl+t>ctrl+h previous_tab
map ctrl+t>{      move_tab_backward
map ctrl+t>}      move_tab_forward
map ctrl+t>,      set_tab_title
map ctrl+t>w      select_tab

map ctrl+t>\ launch --location=vsplit --cwd=current
map ctrl+t>- launch --location=hsplit --cwd=current

map ctrl+t>h neighboring_window left
map ctrl+t>j neighboring_window down
map ctrl+t>k neighboring_window up
map ctrl+t>l neighboring_window right

map --new-mode resize --timeout 0 --on-unknown end ctrl+t>r
map --mode resize h resize_window narrower 10
map --mode resize j resize_window shorter 10
map --mode resize k resize_window taller 10
map --mode resize l resize_window wider 10
map --mode resize shift+h resize_window narrower 10
map --mode resize shift+j resize_window shorter 10
map --mode resize shift+k resize_window taller 10
map --mode resize shift+l resize_window wider 10
map --mode resize esc pop_keyboard_mode
map ctrl+t>shift+h combine : resize_window narrower 10 : push_keyboard_mode resize
map ctrl+t>shift+j combine : resize_window shorter 10 : push_keyboard_mode resize
map ctrl+t>shift+k combine : resize_window taller 10 : push_keyboard_mode resize
map ctrl+t>shift+l combine : resize_window wider 10 : push_keyboard_mode resize
#: }}}
