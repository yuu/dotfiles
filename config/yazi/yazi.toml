# https://github.com/sxyazi/yazi/blob/v26.8.15/yazi-config/preset/yazi-default.toml

[mgr]
show_hidden = false

[preview]
max_width = 2560

[opener]
play = [
  { run = 'vlc %s', orphan = true, desc = "VLC", for = "unix" },
  { run = 'mpv --no-video %s', orphan = true, desc = "MPV Audio", for = "unix" },
  { run = 'mpv %s', orphan = true, desc = "MPV", for = "unix" },
  { run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
edit = [
  { run = 'vi %s', block = true, for = "unix" },
  { run = "%EDITOR% %s",  block = true, for = "windows" },
  { run = 'code %s', block = false, desc = "VSCode", for = "unix" },
]

[[opener.set-wallpaper]]
run = '''
  osascript -e 'on run {img}' -e 'tell application "system events" to set picture of every desktop to img' -e 'end run' %s1
'''
for  = "macos"
desc = "set as wallpaper"

[[opener.set-wallpaper1]]
run = '''
  osascript -e 'on run {img}' -e 'tell application "system events" to set picture of desktop 1 to img' -e 'end run' %s1
'''
for  = "macos"
desc = "set as wallpaper1"

[[opener.set-wallpaper2]]
run = '''
  osascript -e 'on run {img}' -e 'tell application "system events" to set picture of desktop 2 to img' -e 'end run' %s1
'''
for  = "macos"
desc = "set as wallpaper2"

[[opener.set-wallpaper3]]
run = '''
  osascript -e 'on run {img}' -e 'tell application "system events" to set picture of desktop 3 to img' -e 'end run' %s1
'''
for  = "macos"
desc = "set as wallpaper3"

[[opener.open-pdf]]
run = '''
  tdf %s
'''
block = true
desc = "Open pdf by tdf"

[open]
prepend_rules = [
  { url = "*.mkv", use = ["play", "open"] },
  { url = "*.m3u", use = ["play"] },
  { url = "*.gsheet", use = ["open"] },
  { url = "*.gdraw", use = ["open"] },
  { mime = "application/pdf", use = ["open-pdf", "open"] },
  { mime = "image/*", use = ["open", "set-wallpaper", "set-wallpaper1", "set-wallpaper2", "set-wallpaper3"] },
]
